name: Render video

# Render video Remotion di mesin GitHub (gratis).
# Cara pakai: tab Actions -> Render video -> Run workflow -> pilih komposisi -> Run.
# Hasilnya muncul sebagai artifact (file .mp4) di halaman run tersebut.
on:
  workflow_dispatch:
    inputs:
      composition:
        description: "ID komposisi yang dirender"
        required: true
        default: "UndurUndur"
        type: choice
        options:
          - UndurUndur
          - TheLastFlight
          - TheLastFlightV2
          - RatuDanRaksasa
          - RatuDanRaksasaV2

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install headless Chrome untuk Remotion
        run: npx remotion browser ensure

      - name: Render
        run: npx remotion render "${{ inputs.composition }}" "out/${{ inputs.composition }}.mp4"

      - name: Upload hasil video
        uses: actions/upload-artifact@v4
        with:
          name: "${{ inputs.composition }}.mp4"
          path: "out/${{ inputs.composition }}.mp4"
          retention-days: 7
